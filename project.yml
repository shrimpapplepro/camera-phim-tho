name: TrueShot
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  # Icon Composer file type fix + optional signing team from a local .team file (see the script).
  postGenCommand: scripts/postgen.sh
settings:
  base:
    # Change this to your own reverse-DNS prefix before building (e.g. com.yourname).
    BUNDLE_ID_PREFIX: com.thanhtu
    # Version for the app AND both extensions (Apple requires them to match). Bump here only —
    # edits made in Xcode are overwritten by `xcodegen generate`.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TrueShot:
    type: application
    platform: iOS
    sources:
      - path: TrueShot
        excludes: ["Resources/LUTs", "AppIcon.icon"]
      - path: TrueShot/AppIcon.icon
        type: file
        buildPhase: resources
      - path: TrueShot/Resources/LUTs
        type: folder
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: TrueShotControls
      - target: TrueShotCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).TrueShot
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Phim Thô"
        INFOPLIST_KEY_NSCameraUsageDescription: "Phim Thô uses the camera to capture unprocessed RAW photos."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Phim Thô saves your RAW (DNG) photos to your library."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO

  # Lock Screen / Control Center / Action button control that launches TrueShot.
  TrueShotControls:
    type: app-extension
    platform: iOS
    sources:
      - Controls
      - Shared
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: "Phim Thô"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).TrueShot.Controls
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # The camera that runs over the Lock Screen (LockedCameraCapture, ExtensionKit).
  # Same camera code as the app; LUTs are read from the containing app's bundle.
  TrueShotCapture:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: TrueShot
        excludes: ["App/**", "Resources/**", "AppIcon.icon"]
      - Shared
      - Capture
    info:
      path: Capture/Info.plist
      properties:
        CFBundleDisplayName: "Phim Thô"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
        NSCameraUsageDescription: "Phim Thô uses the camera to capture unprocessed RAW photos."
        NSPhotoLibraryAddUsageDescription: "Phim Thô saves your RAW (DNG) photos to your library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).TrueShot.Capture
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
